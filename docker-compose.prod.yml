name: p2app-prod

services:
  db:
    image: postgres:16-alpine
    container_name: p2app-prod-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p2app-prod-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      API_ROOT_PATH: /api
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./p2app-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_APP_SHORT_NAME: ${NEXT_PUBLIC_APP_SHORT_NAME:-}
        NEXT_PUBLIC_APP_TAGLINE: ${NEXT_PUBLIC_APP_TAGLINE:-}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:-}
        NEXT_PUBLIC_APP_SUBTITLE: ${NEXT_PUBLIC_APP_SUBTITLE:-}
        NEXT_PUBLIC_APP_HERO_TITLE: ${NEXT_PUBLIC_APP_HERO_TITLE:-}
        NEXT_PUBLIC_APP_HERO_BODY: ${NEXT_PUBLIC_APP_HERO_BODY:-}
        NEXT_PUBLIC_AUTH_BADGE: ${NEXT_PUBLIC_AUTH_BADGE:-}
        NEXT_PUBLIC_DEMO_LABEL: ${NEXT_PUBLIC_DEMO_LABEL:-}
        NEXT_PUBLIC_DEMO_DESCRIPTION: ${NEXT_PUBLIC_DEMO_DESCRIPTION:-}
        NEXT_PUBLIC_TRUST_ITEMS: ${NEXT_PUBLIC_TRUST_ITEMS:-}
        NEXT_PUBLIC_ACCENT_COLOR: ${NEXT_PUBLIC_ACCENT_COLOR:-}
        NEXT_PUBLIC_BG_DEEP: ${NEXT_PUBLIC_BG_DEEP:-}
        NEXT_PUBLIC_BG_CARD: ${NEXT_PUBLIC_BG_CARD:-}
        NEXT_PUBLIC_BG_ACCENT: ${NEXT_PUBLIC_BG_ACCENT:-}
        NEXT_PUBLIC_AUTH_TOKEN_KEY: ${NEXT_PUBLIC_AUTH_TOKEN_KEY:-}
        NEXT_PUBLIC_AUTH_USER_KEY: ${NEXT_PUBLIC_AUTH_USER_KEY:-}
        NEXT_PUBLIC_AUTH_EVENT: ${NEXT_PUBLIC_AUTH_EVENT:-}
        NEXT_PUBLIC_AUTH_CHANNEL: ${NEXT_PUBLIC_AUTH_CHANNEL:-}
    container_name: p2app-prod-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    expose:
      - "3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    container_name: p2app-prod-proxy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/p2app.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
    name: p2app_prod_postgres_data
